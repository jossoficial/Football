name: Automated Football Analysis Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Todos los días a las 08:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha a procesar en formato YYYY-MM-DD (opcional). Si está vacío, se usará la fecha actual UTC.'
        required: false

env:
  THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
  ISPORTSAPI_KEY: ${{ secrets.ISPORTSAPI_KEY }}
  TF_CPP_MIN_LOG_LEVEL: '2'
  TF_ENABLE_ONEDNN_OPTS: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  run-analysis:
    name: Run daily match discovery and analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (if requirements.txt exists)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — skipping pip install"
          fi

      - name: Discover matches and run analysis per MATCH_ID
        id: run_pipeline
        shell: bash -l {0}
        run: |
          set -euo pipefail

          date_input="${{ github.event.inputs.date }}"
          if [ -z "${date_input:-}" ]; then
            PROCESS_DATE="$(date -u +%F)"
          else
            PROCESS_DATE="$date_input"
          fi
          echo "Processing date: $PROCESS_DATE"

          echo "Running match finder..."
          OUTPUT="$(python -m engine.match_finder "$PROCESS_DATE" 2>&1 || true)"
          echo "Raw output of match_finder:"
          echo "$OUTPUT"

          mapfile -t RAW_IDS < <(echo "$OUTPUT" | grep -oE 'MATCH_ID:mt_[0-9]+' || true)

          if [ "${#RAW_IDS[@]}" -eq 0 ]; then
            echo "::error::No se encontraron MATCH_ID válidos en la salida. Aborting."
            exit 1
          fi

          echo "Found ${#RAW_IDS[@]} match(es). Preparing to iterate..."

          for raw in "${RAW_IDS[@]}"; do
            mt_part="$(echo "$raw" | sed -E 's/^MATCH_ID://')"
            clean_id="$(echo "$mt_part" | sed -E 's/^mt_//' | sed -E 's/^0+//')"

            if [ -z "$clean_id" ]; then
              echo "::warning::El ID '$raw' se limpió a vacío — se omite."
              continue
            fi

            export MATCH_ID="$clean_id"
            echo "==== Running analysis for MATCH_ID=$MATCH_ID ===="
            if ! python main.py; then
              echo "::error::Analysis failed for MATCH_ID=$MATCH_ID"
              exit 1
            fi
            echo "==== Finished analysis for MATCH_ID=$MATCH_ID ===="
          done

          echo "All analyses completed successfully."
