name: Automated Football Analytics Pipeline

on:
  # 1. Automatización: Se ejecuta solo todos los días a las 8:00 AM UTC
  schedule:
    - cron: '0 8 * * *'
  
  # 2. Ejecución Manual: Te permite forzar el análisis de una fecha específica desde la interfaz de GitHub
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha a analizar (Dejar vacío para el día de hoy / YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  scan_and_predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run Full Jornada Analytics
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          ISPORTSAPI_KEY: ${{ secrets.ISPORTSAPI_KEY }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          # Oculta las advertencias innecesarias de optimización y compilación de TensorFlow
          TF_CPP_MIN_LOG_LEVEL: '2'
          # Desactiva las alertas personalizadas del optimizador de operaciones integradas de Intel
          TF_ENABLE_ONEDNN_OPTS: '0'
        run: |
          # 1. Determinar la fecha correcta a procesar (Manual o la del día de hoy en curso)
          if [ -z "$INPUT_DATE" ]; then
            TARGET_DATE=$(date +%Y-%m-%d)
          else
            TARGET_DATE="$INPUT_DATE"
          fi
          
          echo "========================================="
          echo "📆 Iniciando procesamiento para la fecha: $TARGET_DATE"
          echo "========================================="
          
          # 2. Ejecutar el buscador de partidos y capturar la salida en un archivo temporal
          python -m engine.match_finder "$TARGET_DATE" > raw_output.txt 2>&1
          
          echo "--- SALIDA DE MATCH_FINDER ---"
          cat raw_output.txt
          echo "--- FIN SALIDA ---"

          # 3. Extraer IDs de partidos buscando líneas con formato 'MATCH_ID:'
          MATCH_IDS=$(grep -oP 'MATCH_ID:\K[0-9]+' raw_output.txt | sort -u)

          if [ -z "$MATCH_IDS" ]; then
            echo "⚠️ No se encontraron IDs de partidos válidos en la salida de match_finder para la fecha $TARGET_DATE."
            echo "Esto puede significar que no hay partidos programados para esta fecha."
            exit 0
          fi

          echo "📊 Partidos detectados en la jornada:"
          echo "$MATCH_IDS"
          print_line="========================================="

          # 4. Bucle iterativo automático: Procesa cada MATCH_ID extraído
          for MATCH_ID in $MATCH_IDS; do
            # Validar que el ID no esté vacío
            if [ -z "$MATCH_ID" ]; then
              continue
            fi

            echo -e "\n$print_line"
            echo "🚀 PROCESANDO PARTIDO ID: $MATCH_ID"
            echo -e "$print_line\n"
            
            # Ejecutamos la proyección CatBoost + LSTM asignando el ID dinámicamente
            MATCH_ID=$MATCH_ID python main.py
            
            # Capturar errores de ejecución sin detener el pipeline
            if [ $? -ne 0 ]; then
              echo "⚠️ Advertencia: Error procesando el partido $MATCH_ID, continuando con el siguiente..."
            fi
          done
          
          echo -e "\n✅ Finalizado el procesamiento de la jornada completa de forma automatizada."
